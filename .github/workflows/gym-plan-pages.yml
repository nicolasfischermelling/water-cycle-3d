name: Deploy Gym Plan to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['gym-plan/**', '.github/workflows/gym-plan-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-plan/package-lock.json
      - run: npm ci
        working-directory: gym-plan
      - run: npm run build
        working-directory: gym-plan
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gym-plan/dist
      - id: deployment
        uses: actions/deploy-pages@v4
